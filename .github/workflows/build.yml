name: Paketleri derle (macOS + Windows)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  APP_NAME: "e-Defter Berati Donusturucu"

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Chromium'u playwright paketinin icine indir
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install chromium

      - name: PyInstaller ile derle
        run: pyinstaller xmltopdf.spec --noconfirm

      - name: Playwright driver/Chromium'u pakete kopyala
        run: python packaging/copy_playwright_driver.py "dist/${{ env.APP_NAME }}.app"

      - name: Selftest (paketlenmis binary gercekten PDF uretebiliyor mu?)
        run: |
          "dist/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}" --selftest
          cat selftest_result.txt

      - name: .app'i zip'le (ditto ile - imzalari/symlink'leri korur)
        run: ditto -c -k --sequesterRsrc --keepParent "dist/${{ env.APP_NAME }}.app" "${{ env.APP_NAME }}-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS
          path: ${{ env.APP_NAME }}-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Chromium'u playwright paketinin icine indir
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install chromium

      - name: PyInstaller ile derle
        run: pyinstaller xmltopdf.spec --noconfirm

      - name: Playwright driver/Chromium'u pakete kopyala
        run: python packaging/copy_playwright_driver.py "dist/${{ env.APP_NAME }}"

      - name: Selftest (paketlenmis binary gercekten PDF uretebiliyor mu?)
        shell: pwsh
        run: |
          & "dist\${{ env.APP_NAME }}\${{ env.APP_NAME }}.exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest exit code $LASTEXITCODE" }
          Get-Content selftest_result.txt

      - name: Klasoru zip'le
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ env.APP_NAME }}" -DestinationPath "${{ env.APP_NAME }}-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows
          path: ${{ env.APP_NAME }}-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release olustur
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
